name: Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: wikijs-mcp-rag

jobs:
  quality:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      # Bisect step for the SIGSEGVs seen in Vitest forks: runs the exact
      # native ops (vec0 DDL + KNN) in plain Node, outside the test runner.
      # Fail here => bindings broken on this platform; pass here + red test
      # => Vitest-specific crash.
      - name: Native smoke (plain node, no vitest)
        run: node scripts/native-smoke.mjs

      - run: npm test

  docker:
    name: Build & push image (amd64 + arm64)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU only emulates the JS build (tsc): both native deps ship prebuilt
      # binaries in their npm packages, nothing is compiled inside Docker.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase names; the owner and image name are lowercase.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=wikijs-mcp-rag
            org.opencontainers.image.description=MCP server with RAG (semantic search) for a private Wiki.js instance
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pulls the just-pushed image back and boots it (no auth, no wiki
      # reachable): validates entrypoint, non-root handoff and /health.
      - name: Smoke test (pull + run + health)
        run: |
          docker run -d --name smoke \
            -p 8000:8000 \
            -e MCP_ALLOW_NOAUTH=true \
            -e WIKIJS_BASE_URL=http://wiki:3000 \
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then echo " -> healthy"; exit 0; fi
            sleep 2
          done
          docker logs smoke || true
          exit 1
