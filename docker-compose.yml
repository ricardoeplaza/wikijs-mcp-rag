# =============================================================================
# wikijs-mcp-rag — local deployment (only our service)
#
# Wiki.js and the embeddings server are EXTERNAL: they are not defined here.
# Point to them from .env (WIKIJS_BASE_URL, EMBEDDINGS_BASE_URL).
#
# Usage:
#   cp .env.example .env   # fill in MCP_TOKEN (WIKIJS_TOKEN only if the instance uses an API key)
#   docker compose up -d --build
# =============================================================================
services:
  wikijs-mcp-rag:
    build: .
    image: wikijs-mcp-rag:latest
    container_name: wikijs-mcp-rag
    # All config.ts variables come from .env (see .env.example).
    env_file:
      - .env
    environment:
      # SQLite path inside the container, on the persistent /data volume.
      # Overrides RAG_DB_PATH from .env so it is correct under Docker.
      RAG_DB_PATH: /data/wikijs-rag.db
    ports:
      # <host>:<container>. The container always listens on 8000 (EXPOSE in the Dockerfile).
      - "${MCP_PORT:-8000}:8000"
    volumes:
      # SQLite database persistence (chunks + vectors) across restarts.
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      # GET /health requires no auth and responds { status: 'ok' }.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
